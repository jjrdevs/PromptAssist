[package]
name = "promptassist-gui"
version = "0.1.0"
edition = "2021"
description = "PromptAssist GUI — Tauri 2 tray + shortcut utility for the 6-stage AI-coding workflow"
license = "MIT"
repository = "https://github.com/jjrdevs/promptassist"

[lib]
name = "promptassist_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "promptassist"
path = "src/bin/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "image-ico",
    "protocol-asset",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
panic = "abort"
opt-level = "s"